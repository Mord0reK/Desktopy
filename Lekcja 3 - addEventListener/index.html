<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>addEventSelector</title>
</head>
<body>
    <input type="text" name="dlugosc" value="" id="wartosc"><br><br>
    <input type="button" value="Sprawdź długość" id="przycisk">
    <br><br>
    <div id="wynik">

    </div>
    <script>
        document.getElementById('przycisk').addEventListener("click", function (){
            document.getElementById('wynik').textContent = "Liczba znaków: " + document.getElementById('wartosc').value.length
        })
    </script>
</body>
</html>
